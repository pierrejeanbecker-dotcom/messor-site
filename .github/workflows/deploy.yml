name: Publier le site

# production  -> https://messor.fr : dossier www/site-messor, servi grâce à deploy/www.htaccess
#                (le .htaccess de WordPress est sauvegardé une fois en www/.htaccess-wordpress)
# preview     -> dossier www/nouveau-site (plus accessible depuis la bascule, conservé pour mémoire)
on:
  push:
    branches: [claude/nifty-brown-5gkbin, main]
  workflow_dispatch:
    inputs:
      target:
        description: "Où publier"
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Choisir la destination
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "SITE_BASE=/" >> "$GITHUB_ENV"
            echo "REMOTE_DIR=www/site-messor" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE=/nouveau-site" >> "$GITHUB_ENV"
            echo "REMOTE_DIR=www/nouveau-site" >> "$GITHUB_ENV"
          fi

      - name: Construire le site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run build
          npm run check-links

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer sur OVH
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # --delete ne touche qu'au dossier du nouveau site, jamais au reste de l'hébergement.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30;
            mkdir -p -f '$REMOTE_DIR';
            mirror --reverse --delete --parallel=6 --verbose=1 dist/ '$REMOTE_DIR';
            bye"

      - name: Activer le site sur messor.fr
        if: env.TARGET == 'production'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          L() { lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "set sftp:auto-confirm yes; set net:max-retries 3; set cmd:fail-exit yes; $1; bye"; }
          # Sauvegarde unique du .htaccess WordPress (jamais écrasée ensuite)
          if L "cls www/.htaccess-wordpress" >/dev/null 2>&1; then
            echo "Sauvegarde WordPress déjà présente : www/.htaccess-wordpress"
          else
            L "get www/.htaccess -o wp.htaccess"
            if grep -q "site-messor" wp.htaccess; then echo "::error::www/.htaccess est déjà celui du nouveau site, sauvegarde absente"; exit 1; fi
            L "put wp.htaccess -o www/.htaccess-wordpress"
            echo "Sauvegarde créée : www/.htaccess-wordpress"
          fi
          L "put deploy/www.htaccess -o www/.htaccess"
          echo "messor.fr sert maintenant www/site-messor"

      - name: Résumé
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "### En ligne : https://messor.fr" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Préproduction : https://messor.fr/nouveau-site/" >> "$GITHUB_STEP_SUMMARY"
          fi
