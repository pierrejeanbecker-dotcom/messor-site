name: Importer depuis OVH

# Copie les thèmes et extensions du WordPress en ligne vers ce dépôt.
# Lecture seule côté OVH : rien n'est modifié sur le serveur.
on:
  workflow_dispatch:
    inputs:
      remote_dir:
        description: "Dossier du WordPress sur OVH (celui qui contient wp-config.php)"
        default: "/www"
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Vérifier le dossier WordPress
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes; set net:max-retries 2;
            echo '--- Contenu de la racine ---'; cls -1 /;
            echo '--- Contenu de $REMOTE_DIR ---'; cls -1 '$REMOTE_DIR';
            bye" 
          if ! lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" \
               -e "set sftp:auto-confirm yes; cls '$REMOTE_DIR/wp-config.php'; bye" >/dev/null 2>&1; then
            echo "::error::Aucun wp-config.php dans $REMOTE_DIR. Relancez avec le bon dossier (voir la liste ci-dessus)."
            exit 1
          fi

      - name: Télécharger thèmes et extensions
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          for d in themes plugins mu-plugins; do
            mkdir -p "wp-content/$d"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "
              set sftp:auto-confirm yes; set net:max-retries 2;
              mirror --delete --parallel=4 --exclude-glob '*.log' '$REMOTE_DIR/wp-content/$d' 'wp-content/$d';
              bye" || echo "wp-content/$d absent sur le serveur, ignoré."
          done
          du -sh wp-content/* || true

      - name: Enregistrer dans Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wp-content
          if git diff --cached --quiet; then
            echo "Aucun changement par rapport au serveur."
          else
            git commit -m "Import des thèmes et extensions depuis OVH"
            git push
          fi
