name: Déployer vers OVH

# Envoie un thème (ou une extension) du dépôt vers le WordPress en ligne.
# Manuel uniquement, et sans suppression de fichiers sur le serveur.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Dossier à envoyer, ex. wp-content/themes/mon-theme"
        required: true
      remote_dir:
        description: "Dossier du WordPress sur OVH"
        default: "/www"
        required: true
      dry_run:
        description: "Simulation (ne rien envoyer, juste lister)"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le chemin
        env:
          DEPLOY_PATH: ${{ inputs.path }}
        run: |
          case "$DEPLOY_PATH" in
            wp-content/themes/?*|wp-content/plugins/?*|wp-content/mu-plugins*) ;;
            *) echo "::error::Seuls wp-content/themes/..., plugins/... ou mu-plugins sont autorisés."; exit 1 ;;
          esac
          case "$DEPLOY_PATH" in *..*) echo "::error::Chemin invalide."; exit 1 ;; esac
          test -d "$DEPLOY_PATH" || { echo "::error::$DEPLOY_PATH n'existe pas dans le dépôt."; exit 1; }

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_PATH: ${{ inputs.path }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          OPTS="--reverse --only-newer --parallel=4 --verbose"
          [ "$DRY_RUN" = "true" ] && OPTS="$OPTS --dry-run"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes; set net:max-retries 2;
            mirror $OPTS '$DEPLOY_PATH' '$REMOTE_DIR/$DEPLOY_PATH';
            bye"
