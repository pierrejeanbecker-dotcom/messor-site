/* ── NAV ── */
function Nav({ scrolled }) {
  return (
    <header style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      background: scrolled ? 'rgba(249,247,243,0.96)' : 'transparent',
      backdropFilter: scrolled ? 'blur(12px)' : 'none',
      borderBottom: scrolled ? '1px solid oklch(88% 0.005 80)' : '1px solid transparent',
      transition: 'all 0.3s ease'
    }}>
      <nav style={{
        maxWidth: 1200, margin: '0 auto',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 32px', height: 68
      }}>
        <a href="#" style={{ textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 10 }}>
          <img src={window.__resources.logoMark} alt="Messor" style={{ width: 32, height: 32, objectFit: 'contain', display: 'block' }} />
          <span style={{ fontWeight: 700, fontSize: 18, color: scrolled ? 'var(--ink)' : 'white', letterSpacing: '0.02em', transition: 'color 0.3s', textTransform: 'uppercase' }}>M<span style={{ color: 'var(--gold)' }}>€</span>SSOR</span>
        </a>

        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }} className="desktop-nav">
          {[
          { label: 'Notre expertise', anchor: 'https://messor.fr/base-de-donnees-prospects' },
          { label: 'Nos offres', anchor: 'https://messor.fr/accompagnement-prospection-multicanal' },
          { label: 'Découvrir Messor', anchor: 'https://messor.fr/decouvrir-messor-2' },
          { label: 'Blog', anchor: 'https://messor.fr/blog' },
          { label: 'Contactez-nous', anchor: 'https://messor.fr/contactez-nous' }].
          map((item) =>
          <a key={item.label} href={item.anchor} target="_blank" rel="noopener" style={{
            fontSize: 14, fontWeight: 400,
            color: scrolled ? 'var(--ink-soft)' : 'oklch(78% 0.01 260)',
            textDecoration: 'none', padding: '6px 14px',
            borderRadius: 6, transition: 'color 0.15s'
          }}
          onMouseEnter={(e) => e.currentTarget.style.color = scrolled ? 'var(--ink)' : 'white'}
          onMouseLeave={(e) => e.currentTarget.style.color = scrolled ? 'var(--ink-soft)' : 'oklch(78% 0.01 260)'}>
            {item.label}</a>
          )}
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <a href="index.en.html" title="English version" aria-label="Switch to English"
             style={{
               display: 'inline-flex', alignItems: 'center', gap: 6,
               textDecoration: 'none',
               fontSize: 12, fontWeight: 600, letterSpacing: '0.06em',
               color: scrolled ? 'var(--ink-soft)' : 'oklch(78% 0.01 260)',
               border: scrolled ? '1px solid var(--line)' : '1px solid oklch(40% 0.01 260)',
               borderRadius: 100, padding: '5px 10px 5px 6px',
               transition: 'all 0.15s'
             }}
             onMouseEnter={(e) => { e.currentTarget.style.color = scrolled ? 'var(--ink)' : 'white'; e.currentTarget.style.borderColor = scrolled ? 'var(--ink)' : 'white'; }}
             onMouseLeave={(e) => { e.currentTarget.style.color = scrolled ? 'var(--ink-soft)' : 'oklch(78% 0.01 260)'; e.currentTarget.style.borderColor = scrolled ? 'var(--line)' : 'oklch(40% 0.01 260)'; }}>
            <span style={{ fontSize: 14, lineHeight: 1 }} aria-hidden="true">🌐</span>
            <span>EN</span>
          </a>
          <a href="#contact" style={{
            background: 'var(--gold)', color: 'var(--dark)',
            fontSize: 13, fontWeight: 600, padding: '9px 20px',
            borderRadius: 7, textDecoration: 'none',
            transition: 'background 0.15s'
          }}
          onMouseEnter={(e) => {e.currentTarget.style.background = 'white';}}
          onMouseLeave={(e) => {e.currentTarget.style.background = 'var(--gold)';}}>
            Parlons-en →</a>
        </div>
      </nav>
      <style>{`@media(max-width:900px){ .desktop-nav{display:none!important;} }`}</style>

}

/* ── HERO — resserré, orienté ICP + promesse ── */
function Hero() {
  const altWords = ['produit', 'service'];
  const [wIdx, setWIdx] = React.useState(0);
  const [wVisible, setWVisible] = React.useState(true);
  React.useEffect(() => {
    const t = setInterval(() => {
      setWVisible(false);
      setTimeout(() => {
        setWIdx((i) => (i + 1) % altWords.length);
        setWVisible(true);
      }, 280);
    }, 2400);
    return () => clearInterval(t);
  }, []);
  return (
    <section style={{
      background: 'var(--dark)',
      minHeight: '100vh',
      display: 'flex', flexDirection: 'column', justifyContent: 'center',
      padding: '120px 32px 60px',
      position: 'relative', overflow: 'hidden'
    }}>
      {/* Bruegel — The Harvesters (1565, public domain, The Met) */}
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `url("${window.__resources.bruegel}")`,
        backgroundSize: 'cover',
        backgroundPosition: 'center 30%',
        filter: 'grayscale(0.3) contrast(1.05) brightness(0.55)',
        opacity: 0.55
      }}></div>
      {/* dark gradient overlay for legibility */}
      <div style={{
        position: 'absolute', inset: 0,
        background: 'linear-gradient(180deg, oklch(11% 0.015 260 / 0.85) 0%, oklch(11% 0.015 260 / 0.65) 40%, oklch(11% 0.015 260 / 0.9) 100%)'
      }}></div>
      {/* subtle grid on top */}
      {/* Bruegel painting — anchors the brand metaphor */}
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `url("${window.__resources.bruegel}")`,
        backgroundSize: 'cover',
        backgroundPosition: '30% 90%',
        opacity: 0.85,
        pointerEvents: 'none'
      }}></div>
      {/* Dark overlay for legibility — left-heavy so text remains readable */}
      <div style={{
        position: 'absolute', inset: 0,
background: 'linear-gradient(95deg, oklch(11% 0.015 260 / 0.95) 0%, oklch(11% 0.015 260 / 0.85) 35%, oklch(11% 0.015 260 / 0.55) 65%, oklch(11% 0.015 260 / 0.3) 100%)',
        pointerEvents: 'none'
      }}></div>
      <div style={{
        position: 'absolute', inset: 0,
        background: 'linear-gradient(180deg, transparent 0%, transparent 60%, var(--dark) 100%)',
        pointerEvents: 'none'
      }}></div>
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: 'linear-gradient(oklch(30% 0.01 255 / 0.12) 1px, transparent 1px), linear-gradient(90deg, oklch(30% 0.01 255 / 0.12) 1px, transparent 1px)',
        backgroundSize: '80px 80px',
        opacity: 0.5
      }}></div>
      <div style={{ position: 'absolute', top: -200, right: -200, width: 600, height: 600, borderRadius: '50%', background: 'oklch(72% 0.14 68 / 0.12)', filter: 'blur(80px)', pointerEvents: 'none' }}></div>

      {/* Painting credit */}
      <div style={{ position: 'absolute', bottom: 24, right: 32, fontSize: 11, color: 'oklch(55% 0.01 260)', letterSpacing: '0.04em', zIndex: 2 }}>
        Pieter Bruegel l'Ancien · <em>Les Moissonneurs</em>, 1565
      </div>

      <div style={{ maxWidth: 1200, margin: '0 auto', width: '100%', position: 'relative' }}>

        <div style={{ marginBottom: 28 }}>
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 8,
            background: 'oklch(72% 0.14 68 / 0.12)', border: '1px solid oklch(72% 0.14 68 / 0.3)',
            color: 'var(--gold)', borderRadius: 100, padding: '5px 14px', fontSize: 12, fontWeight: 500,
            letterSpacing: '0.06em', textTransform: 'uppercase'
          }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--gold)' }}></span>
            Cabinets de conseil · éditeurs SaaS · sociétés de services
          </span>
        </div>

        <h1 style={{
          fontFamily: 'var(--font-serif)', fontWeight: 400, color: 'white',
          fontSize: 'clamp(44px, 6vw, 86px)', lineHeight: 1.03,
          letterSpacing: '-0.025em', marginBottom: 28, maxWidth: 960
        }}>
          Vous avez semé un{' '}
          <span style={{
            display: 'inline-block', minWidth: '4.5ch',
            color: 'var(--gold)',
            opacity: wVisible ? 1 : 0,
            transform: wVisible ? 'translateY(0)' : 'translateY(8px)',
            transition: 'opacity 0.28s ease, transform 0.28s ease'
          }}>{altWords[wIdx]}</span>.<br />
          <em style={{ color: 'var(--gold)' }}>Nous moissonnons</em> vos clients.
        </h1>

        <p style={{
          color: 'oklch(72% 0.01 260)', fontSize: 'clamp(17px, 1.5vw, 20px)',
          maxWidth: 640, lineHeight: 1.6, marginBottom: 44, fontWeight: 300
        }}>Agence de business development B2B basée à Metz. Nous vous accompagnons par petit bout ou de bout en bout — ciblage, prise de contact multicanal, prise de rendez-vous, (co-)réalisation des rdvs, gestion du suivi post-rdvs — pour vous aider à signer de nouveaux clients.

        </p>

        <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', alignItems: 'center', marginBottom: 72 }}>
          <a href="https://bookings.cloud.microsoft/bookwithme/user/c844084bf24a4ff7ba01283a2e3266ed%40messor.fr?anonymous&ismsaljsauthenabled=true"
          target="_blank" rel="noopener"
          style={{
            background: 'var(--gold)', color: 'var(--dark)',
            fontWeight: 600, fontSize: 15, padding: '14px 26px',
            borderRadius: 8, textDecoration: 'none',
            transition: 'all 0.15s'
          }}
          onMouseEnter={(e) => {e.currentTarget.style.background = 'white';}}
          onMouseLeave={(e) => {e.currentTarget.style.background = 'var(--gold)';}}>
            Réserver un diagnostic de 30 min →</a>
          <a href="#resultats" style={{
            color: 'oklch(78% 0.01 260)', fontSize: 14, textDecoration: 'none',
            padding: '14px 4px', borderBottom: '1px solid oklch(40% 0.01 260)',
            transition: 'color 0.15s, border-color 0.15s'
          }}
          onMouseEnter={(e) => {e.currentTarget.style.color = 'white';e.currentTarget.style.borderColor = 'white';}}
          onMouseLeave={(e) => {e.currentTarget.style.color = 'oklch(78% 0.01 260)';e.currentTarget.style.borderColor = 'oklch(40% 0.01 260)';}}>
            Voir les résultats clients</a>
        </div>

        {/* Result-driven stat bar (not vanity metrics) */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 24,
          paddingTop: 44, borderTop: '1px solid var(--line-dark)'
        }}>
          {[
          { n: '+50%', label: 'de trafic généré pour un éditeur SAAS luxembourgeois' },
          { n: '10M€', label: 'le chiffre d\'affaires signé ensemble avec notre principal partenaire' },

              <div style={{ color: 'oklch(60% 0.01 260)', fontSize: 13, lineHeight: 1.4 }}>{s.label}</div>
            </div>
          )}
        </div>
      </div>
    </section>);

}

/* ── PAIN POINTS — le prospect se reconnaît ── */
function Problem() {

  { label: "Vos consultants ne sont pas des vendeurs" },
  { label: "Vous préférez closer qu'aller dénicher des opportunités" },

  { label: "Votre CRM est plein de leads froids jamais retravaillés" },
  { label: "Recruter un SDR en interne est long, coûteux et risqué" },
  { label: "Vous attaquez de nouveaux marchés sans vraiment savoir par où commencer" }];

  return (
    <section style={{ background: 'var(--paper)', padding: '90px 32px' }}>

/* ── APP ── */
function App() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').style.display = 'block';
      if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').style.display = 'none';
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  return (
    <>
      <Nav scrolled={scrolled} />
      <Hero />
      <Clients />
      <Problem />
      <Offres />
      <Process />
      <Results />
      <Why />
      <Testimonials />
      <FAQ />
      <Contact />
      <Footer />

      <div id="tweaks-panel" style={{ display: 'none', position: 'fixed', bottom: 24, right: 24, zIndex: 999, background: 'white', border: '1px solid var(--line)', borderRadius: 12, padding: '20px 24px', boxShadow: '0 8px 40px oklch(0% 0 0 / 0.15)', width: 260 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <span style={{ fontWeight: 600, fontSize: 14 }}>Tweaks</span>
          <button onClick={() => {document.getElementById('tweaks-panel').style.display = 'none';window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');}} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 18, color: 'var(--ink-muted)' }}>×</button>
        </div>
        <div>
          <label style={{ fontSize: 12, color: 'var(--ink-muted)', display: 'block', marginBottom: 6 }}>Couleur d'accent</label>
          <input type="color" defaultValue="#13C995" onChange={(e) => document.documentElement.style.setProperty('--gold', e.target.value)} style={{ width: '100%', height: 36, border: '1px solid var(--line)', borderRadius: 6, cursor: 'pointer' }} />
        </div>
      </div>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
